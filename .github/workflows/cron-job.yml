name: Run TrendifyTube Automation

on:
  schedule:
    # Runs at 5:00 AM UTC daily (adjust as needed)
    - cron: '0 5 * * *'

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install dependencies
      run: npm install

    - name: Run automation script
      # Adjust if you want to run your Next.js API route or a standalone script
      run: node ./scripts/auto.js

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUBSTACK_WEBHOOK: ${{ secrets.SUBSTACK_WEBHOOK }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
      BLOG_URL: ${{ secrets.BLOG_URL }}
